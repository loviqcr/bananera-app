name: Mantener el backend activo

# El servicio bananera-backend está en el plan gratuito de Render, que se
# duerme tras ~15 minutos sin peticiones (la primera petición después de
# eso tarda hasta un minuto en despertarlo, y eso hacía que el login se
# sintiera lento/trabado). Este workflow lo "toca" cada 10 minutos para que
# nunca llegue a dormirse — ver la memoria "bananera-render-plan-gratuito-backend".
#
# GitHub puede deshabilitar los workflows programados (schedule) si el
# repositorio pasa 60 días sin ningún commit — si eso pasa, basta con volver
# a activarlo desde la pestaña Actions del repo (o hacer cualquier commit).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {} # para poder correrlo a mano desde la pestaña Actions y probarlo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir /health al backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 90 \
            https://bananera-backend.onrender.com/health
