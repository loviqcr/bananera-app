<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#007820" />
  <title>Cosechas Presbere</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>

  <header class="barra-superior">
    <span class="barra-superior__marca">🍌 Cosechas Presbere</span>
    <span class="barra-superior__contexto" id="barra-contexto"></span>
    <span class="indicador-conexion" id="indicador-conexion">⏳</span>
    <button class="boton-icono" id="boton-cambiar-finca" title="Cambiar finca" hidden>🔁</button>
    <button class="boton-icono" id="boton-salir" title="Salir" hidden>⎋</button>
  </header>

  <div class="aviso-offline" id="aviso-offline" hidden></div>

  <main>

    <!-- ============== LOGIN ============== -->
    <section class="pantalla" id="vista-login">
      <div class="marca-login">
        <img class="marca-login__icono" src="./icons/icon-192.png" alt="Cosechas Presbere" width="96" height="96" />
        <div class="marca-login__titulo">Cosechas Presbere</div>
        <div class="marca-login__subtitulo">Gestión de las 4 fincas — funciona sin internet</div>
      </div>

      <form id="form-login" class="tarjeta">
        <div class="campo">
          <label for="campo-usuario">Usuario</label>
          <input id="campo-usuario" name="usuario" type="text" autocomplete="username" required />
        </div>
        <div class="campo">
          <label for="campo-password">Contraseña</label>
          <input id="campo-password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="mensaje-error" id="error-login"></div>
        <button type="submit" class="boton boton--primario">Ingresar</button>
      </form>

      <p class="pie-pagina">© 2026 JCS Tech Solutions — Costa Rica</p>
    </section>

    <!-- ============== SELECTOR DE FINCA ============== -->
    <section class="pantalla" id="vista-selector-finca" hidden>
      <h1 class="titulo-pantalla">Selecciona una finca</h1>
      <p class="subtitulo-pantalla">Se recordará tu selección — no tendrás que elegirla de nuevo cada vez.</p>
      <div class="cuadricula-fincas" id="cuadricula-fincas"></div>
    </section>

    <!-- ============== SELECTOR DE ÁREA ============== -->
    <section class="pantalla" id="vista-selector-area" hidden>
      <h1 class="titulo-pantalla">Selecciona un área</h1>
      <p class="subtitulo-pantalla" id="nombre-finca-seleccion-area"></p>
      <div class="lista-areas" id="lista-areas"></div>
      <div class="espaciador"></div>
      <button class="boton boton--fantasma" id="boton-agregar-area" hidden>+ Agregar área</button>
    </section>

    <!-- ============== INICIO / DASHBOARD ============== -->
    <section class="pantalla" id="vista-inicio" hidden>
      <h1 class="titulo-pantalla" id="bienvenida-usuario"></h1>
      <p class="subtitulo-pantalla" id="contexto-inicio"></p>

      <div id="contenedor-dashboard"></div>

      <div class="cuadricula-modulos" id="cuadricula-modulos">
        <button class="tarjeta-modulo" data-modulo="produccion">
          <span class="tarjeta-modulo__icono">🍌</span>
          <span>Producción</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="labores">
          <span class="tarjeta-modulo__icono">🌱</span>
          <span>Labores</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="calendario">
          <span class="tarjeta-modulo__icono">📅</span>
          <span>Calendario</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="inventario">
          <span class="tarjeta-modulo__icono">📦</span>
          <span>Inventario / Bodega</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="incidencias">
          <span class="tarjeta-modulo__icono">🚨</span>
          <span>Incidencias</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="planilla">
          <span class="tarjeta-modulo__icono">👷</span>
          <span>Planilla</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="ventas">
          <span class="tarjeta-modulo__icono">💰</span>
          <span>Ventas</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="embolse-corta">
          <span class="tarjeta-modulo__icono">🎗️</span>
          <span>Embolse / Corta</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="reportes">
          <span class="tarjeta-modulo__icono">📊</span>
          <span>Reportes</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="notificaciones">
          <span class="tarjeta-modulo__icono">🔔</span>
          <span>Alertas</span>
        </button>
        <button class="tarjeta-modulo" data-modulo="usuarios">
          <span class="tarjeta-modulo__icono">👤</span>
          <span>Usuarios</span>
        </button>
      </div>
    </section>

    <!-- ============== VISTA DE MÓDULO (contenedor genérico) ============== -->
    <section class="pantalla" id="vista-modulo" hidden>
      <div class="encabezado-modulo">
        <button class="boton-icono" id="boton-volver-inicio" title="Volver" style="background:var(--verde-100);color:var(--primario-fuerte)">←</button>
        <h1 class="encabezado-modulo__titulo" id="titulo-modulo"></h1>
      </div>
      <div id="contenedor-modulo"></div>
    </section>

  </main>

  <script>
    window.BANANERA_API_URL = 'https://bananera-backend.onrender.com';
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
