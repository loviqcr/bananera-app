services:
  - type: web
    name: bananera-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bananera-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: CORS_ORIGINS
        value: https://bananera-app.web.app,https://platanos-app-e8208.web.app
      # Notificaciones push (Web Push / VAPID). La pública es segura de
      # commitear (para eso es pública). La privada NUNCA va en el repo:
      # "sync: false" hace que Render la deje vacía acá — hay que pegarla a
      # mano en el dashboard del servicio (Environment). Ver docs/notas del
      # commit que agregó esto para el valor generado.
      - key: VAPID_PUBLIC_KEY
        value: BFFHzoo2iZ9l3vm17V7h2Gb5jTSf-UWSoCdKVxBorZMAuHn9d2cAB7QF1ves5FEubduIHsW98GthFi7qwO_8Who
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        value: mailto:soporte@cosechaspresbere.com

databases:
  - name: bananera-db
    plan: free
